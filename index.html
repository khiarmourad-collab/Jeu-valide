<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jeu Valide ! — Sahara — Ruines 2D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d99a4e;font-family:Arial,sans-serif;color:#fff;touch-action:manipulation}#game{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:auto;touch-action:none}.panel{background:rgba(48,28,16,.84);border:1px solid #f1d09277;box-shadow:0 8px 25px #2d160a77;backdrop-filter:blur(8px)}#radarBox{position:absolute;left:12px;top:12px;width:170px;height:170px;border-radius:50%;overflow:hidden;border:3px solid #efd18d;z-index:8;pointer-events:none}.off{display:none!important}#radar{width:100%;height:100%}#msg{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:9px 16px;border-radius:18px;font-size:12px;font-weight:800;z-index:8;pointer-events:none}#players{position:absolute;right:12px;top:12px;width:180px;padding:10px;border-radius:16px;font-size:11px;z-index:8;pointer-events:none}.row{padding:6px 2px}.row+.row{border-top:1px solid #fff2}#goal{position:absolute;right:12px;bottom:72px;width:130px;text-align:center;padding:9px;border-radius:15px;font-size:10px;z-index:8;pointer-events:none}.num{font-size:34px;font-weight:1000;color:#70f0cf}#powers{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(620px,96%);display:flex;gap:6px;z-index:12}button{border:1px solid #f4d28b66;background:#4c2b18e8;color:#fff;border-radius:11px;padding:11px 7px;font-weight:800;-webkit-tap-highlight-color:transparent;touch-action:manipulation}#powers button{flex:1;font-size:9px}button:disabled{opacity:.35}button.active{border-color:#ffe17c;box-shadow:0 0 15px #ffe17c88}#radarToggle{position:absolute;left:14px;top:190px;z-index:12;font-size:9px}#hotspots{position:fixed;inset:0;z-index:10;pointer-events:none}.hot{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:3px solid #ffe66f;background:rgba(255,220,70,.10);box-shadow:0 0 14px #ffe66f99;pointer-events:auto;color:#fff8d9;font-size:14px;font-weight:1000;padding:0;text-shadow:0 2px 3px #4a260f}.hot:active{transform:scale(.84);background:rgba(255,255,170,.42)}#start,#end{position:absolute;inset:0;z-index:30;background:radial-gradient(circle at 70% 20%,#ffd77b,#dc9146 48%,#7e4023);display:flex;align-items:center;justify-content:center}.card{width:min(410px,90%);padding:28px;border-radius:24px;text-align:center}.card h1{font-size:38px;margin:0}.card .fox{font-size:70px}.card button{width:100%;margin-top:16px;background:#f4ca63;color:#42210f;padding:14px}.hidden{display:none!important}#valid{position:absolute;inset:0;z-index:25;display:none;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,#66f0c655,transparent 55%);font-size:44px;font-weight:1000;text-shadow:0 4px #4b2a15}#valid.show{display:flex}#valid span{font-size:92px;color:#78ffdb;margin-left:15px}@media(max-width:650px){#radarBox{width:145px;height:145px}#radarToggle{top:165px}#players{width:150px}#msg{top:190px;max-width:72%;text-align:center}#goal{width:115px}.hot{width:56px;height:56px;margin:-28px 0 0 -28px}}</style><style>
html,body{background:#b87d43}#game{touch-action:none}
#radarBox,#radarToggle,#hotspots{display:none!important}
#players{right:8px;top:8px;width:145px}#msg{top:8px;max-width:45%;text-align:center}
#goal{right:8px;bottom:76px}#powers{bottom:max(8px,env(safe-area-inset-bottom))}
@media(max-width:650px){#players{width:126px;font-size:10px}#msg{top:110px;left:50%;max-width:85%;width:max-content}#goal{bottom:74px}}
</style></head><body><canvas id="game"></canvas><div id="hotspots"></div><div id="radarBox"><canvas id="radar"></canvas></div><button id="radarToggle">📡 MASQUER</button><div id="msg" class="panel">Préparation du désert…</div><div id="players" class="panel"></div><div id="goal" class="panel">🌴 TON OASIS<div id="gnum" class="num">?</div><div id="phase"></div></div><div id="powers"><button id="x2">🐾 SPRINT X2</button><button id="bam">💨 CREUSE !</button><button id="tele">🕳️ TERRIER</button><button id="pass">⏩ PASSER</button></div><div id="valid">JE VALIDE ! <span id="vnum"></span></div><div id="start"><div class="card panel"><h1>JEU VALIDE !</h1><div class="fox">🦊</div><p><b>SAHARA — LES RUINES</b><br>Déplace ton fennec sur les dalles reliées.</p><button id="startBtn">JOUER SUR LE PLATEAU</button></div></div><div id="end" class="hidden"><div class="card panel"><h1 id="winner"></h1><div class="fox">🦊🌴</div><p id="score"></p><button id="replay">REJOUER</button></div></div><script>const P={N:[50,4],E:[96,50],S:[50,96],W:[4,50],1:[38,92],2:[9,39],3:[61,8],4:[91,61],5:[27,88],6:[13,28],7:[71,12],8:[87,73],9:[13,73],10:[27,12],11:[87,28],12:[71,88],13:[9,61],14:[38,8],15:[91,39],16:[61,92],VNW:[18,18],VNE:[82,18],VSE:[82,82],VSW:[18,82],VT:[50,28],VR:[72,50],VB:[50,72],VL:[28,50],23:[41,31],18:[59,31],19:[69,41],20:[69,59],21:[59,69],17:[41,69],22:[31,59],24:[31,41],VTL:[35,35],VTR:[65,35],VBR:[65,65],VBL:[35,65],VIT:[50,42],VIR:[58,50],VIB:[50,58],VIL:[42,50],26:[45,45],27:[55,45],28:[55,55],25:[45,55]};
const E=[['N','3'],['3','7'],['7','VNE'],['VNE','11'],['11','15'],['15','E'],['E','4'],['4','8'],['8','VSE'],['VSE','12'],['12','16'],['16','S'],['S','1'],['1','5'],['5','VSW'],['VSW','9'],['9','13'],['13','W'],['W','2'],['2','6'],['6','VNW'],['VNW','10'],['10','14'],['14','N'],['VNW','VT'],['VT','VNE'],['VNE','VR'],['VR','VSE'],['VSE','VB'],['VB','VSW'],['VSW','VL'],['VL','VNW'],['VT','23'],['23','VTL'],['VTL','24'],['24','VL'],['VT','18'],['18','VTR'],['VTR','19'],['19','VR'],['VR','20'],['20','VBR'],['VBR','21'],['21','VB'],['VB','17'],['17','VBL'],['VBL','22'],['22','VL'],['VTL','VIT'],['VTL','VIL'],['VTR','VIT'],['VTR','VIR'],['VBR','VIR'],['VBR','VIB'],['VBL','VIB'],['VBL','VIL'],['VIT','26'],['26','VIL'],['VIT','27'],['27','VIR'],['VIR','28'],['28','VIB'],['VIB','25'],['25','VIL']];
const A={};Object.keys(P).forEach(k=>A[k]=[]);E.forEach(([a,b])=>{A[a].push(b);A[b].push(a)});const G={on:false,p:[],turn:0,deck:[],phase:'move',mode:null,xp:[],moving:false,radar:true,camOrbit:0,camPitch:0};const me=()=>G.p[0],bot=()=>G.p[1];function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function occ(id,ex=-1){return G.p.some((p,i)=>i!==ex&&p.pos===id)}function barr(id){return G.p.findIndex(p=>p.b===id)}function blocked(id,i){let b=barr(id);return occ(id,i)||(b>=0&&b!==i)}function legal(i,from=G.p[i].pos){return A[from].filter(n=>!blocked(n,i))}function path(s,g,i){let q=[[s]],seen=new Set([s]);while(q.length){let p=q.shift(),x=p[p.length-1];if(x===g)return p;for(let n of A[x])if(!seen.has(n)&&!blocked(n,i)){seen.add(n);q.push([...p,n])}}return null}function goal(i){let ok=G.deck.filter(n=>{let b=barr(String(n));return b<0||b===i}),pool=ok.length?ok:G.deck;if(!pool.length)return null;let n=pool[Math.floor(Math.random()*pool.length)];G.deck.splice(G.deck.indexOf(n),1);return String(n)}
function canSelect(id){if(!G.on||G.turn||G.moving)return false;if(G.phase==='barrier')return !occ(id)&&barr(id)<0&&id!==me().b;if(G.mode==='tele')return !occ(id,0)&&barr(id)<0;if(G.mode==='bam')return A[me().pos].includes(id)&&barr(id)===1&&bot().pos!==id;if(G.mode==='x2'){let from=G.xp.length?G.xp[G.xp.length-1]:me().pos;return A[from].includes(id)&&!blocked(id,0)}return legal(0).includes(id)}function currentChoices(){if(!G.on||G.turn||G.moving)return[];if(G.phase==='move'&&!G.mode)return legal(0);return Object.keys(P).filter(canSelect)}
function refresh(){if(!G.on)return;players.innerHTML=G.p.map((p,i)=>`<div class="row"><b>${i?'🦊 Rival rouge':'🦊 Ton fennec'}</b><br>${i?'Objectif secret':'Oasis '+p.g} — ${p.s}/14</div>`).join('');gnum.textContent=me().g||'?';phase.textContent=G.turn?'Tour rival':G.phase==='barrier'?'Pose ta dune':'À toi';msg.textContent=G.turn?'Le rival joue…':G.phase==='barrier'?'Choisis une position libre pour ta dune':G.mode==='x2'?(G.xp.length?'Choisis ton deuxième bond':'Choisis ton premier bond'):G.mode==='tele'?'Choisis une position libre':G.mode==='bam'?'Choisis une dune adverse adjacente':'Touche une case reliée pour avancer';[x2,bam,tele].forEach(b=>b.disabled=G.turn||G.phase!=='move');x2.disabled=x2.disabled||!me().pow.x2;bam.disabled=bam.disabled||!me().pow.bam;tele.disabled=tele.disabled||!me().pow.tele;pass.disabled=G.turn||G.phase!=='move'||legal(0).length>0;x2.classList.toggle('active',G.mode==='x2');bam.classList.toggle('active',G.mode==='bam');tele.classList.toggle('active',G.mode==='tele');draw()}
function move(i,id,cb){if(blocked(id,i))return;G.moving=true;let p=G.p[i],from=p.pos,t=0;function step(){t=Math.min(1,t+.09);animation={i,from,to:id,t};draw();if(t<1)requestAnimationFrame(step);else{p.pos=id;animation=null;G.moving=false;draw();cb&&cb()}}requestAnimationFrame(step)}
function after(i){let p=G.p[i];if(p.pos!==p.g){endTurn();return}let n=p.g;p.s++;if(i===0){vnum.textContent=n;valid.classList.add('show');setTimeout(()=>valid.classList.remove('show'),1800)}if(p.s>=14){winner.textContent=i?'LE FENNEC ROUGE GAGNE':'TON FENNEC GAGNE !';score.textContent=`${me().s} oasis à ${bot().s}`;endPanel.classList.remove('hidden');return}p.g=goal(i);refresh();setTimeout(()=>{G.phase='barrier';refresh();if(i)setTimeout(botDune,450)},i?300:1900)}function endTurn(){G.mode=null;G.xp=[];G.phase='move';G.turn=1-G.turn;refresh();if(G.turn)setTimeout(botTurn,650)}function choose(id){if(!canSelect(id))return;msg.textContent='✅ '+id;if(G.phase==='barrier'){me().b=id;endTurn();return}if(G.mode==='bam'){bot().b=null;me().pow.bam=0;G.mode=null;move(0,id,()=>after(0));return}if(G.mode==='tele'){me().pow.tele=0;G.mode=null;move(0,id,()=>after(0));return}if(G.mode==='x2'){G.xp.push(id);if(G.xp.length<2){refresh();return}let a=G.xp[0],b=G.xp[1];me().pow.x2=0;G.mode=null;G.xp=[];move(0,a,()=>move(0,b,()=>after(0)));return}move(0,id,()=>after(0))}
function botTurn(){if(G.turn!==1||G.moving)return;let p=path(bot().pos,bot().g,1);if(bot().pow.x2&&p&&p.length>=3&&(p.length===3||p.length>=6||bot().s<me().s)){bot().pow.x2=0;move(1,p[1],()=>move(1,p[2],()=>after(1)));return}let free=!occ(bot().g,1)&&barr(bot().g)<0;if(bot().pow.tele&&free&&(!p||p.length>=8)){bot().pow.tele=0;move(1,bot().g,()=>after(1));return}p=path(bot().pos,bot().g,1);if(p&&p[1])move(1,p[1],()=>after(1));else endTurn()}function botDune(){let old=bot().b,op=Object.keys(P).filter(id=>!occ(id)&&barr(id)<0&&id!==old);if(op.length)bot().b=op[Math.floor(Math.random()*op.length)];endTurn()}
function startGame(){G.deck=shuffle([...Array(28)].map((_,i)=>i+1));G.p=[{pos:'S',s:0,g:null,b:null,pow:{x2:1,bam:1,tele:1},face:0},{pos:'N',s:0,g:null,b:null,pow:{x2:1,bam:1,tele:1},face:Math.PI}];G.p.forEach((p,i)=>p.g=goal(i));G.turn=0;G.phase='move';G.camOrbit=0;G.camPitch=0;G.on=true;startPanel.classList.add('hidden');refresh()}function syncHotspots(){hotspots.innerHTML='';for(let id of currentChoices()){let b=document.createElement('button');b.className='hot';b.textContent=id.startsWith('V')?'•':id;b.dataset.id=id;b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();choose(id)});hotspots.appendChild(b)}}

const ctx=canvas.getContext('2d');let animation=null,layout={ox:0,oy:0,size:1};
const noise=(n)=>{let x=Math.sin(n*127.1+7.3)*43758.5453;return x-Math.floor(x)};
function coord(id){let p=P[id];return {x:layout.ox+p[0]*layout.size/100,y:layout.oy+p[1]*layout.size/100}}
function stone(x,y,r,kind='normal'){ctx.save();ctx.shadowColor='#47281988';ctx.shadowBlur=r*.38;ctx.shadowOffsetY=r*.18;ctx.fillStyle='#6b4832';ctx.beginPath();ctx.ellipse(x,y+r*.11,r*1.08,r*.86,0,0,7);ctx.fill();ctx.shadowColor='transparent';let g=ctx.createRadialGradient(x-r*.35,y-r*.4,1,x,y,r*1.3);g.addColorStop(0,kind==='portal'?'#ae85ca':'#f8dd9f');g.addColorStop(.65,kind==='portal'?'#7c589e':'#d7ac71');g.addColorStop(1,kind==='portal'?'#593e72':'#95623e');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,r,r*.82,0,0,7);ctx.fill();ctx.strokeStyle='#fff1c1bb';ctx.lineWidth=Math.max(1,r*.09);ctx.stroke();ctx.restore()}
function draw(){let w=innerWidth,h=innerHeight,d=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);
let availableH=h-((w<650)?190:90),sz=Math.min(w*.97,availableH*.96,850);layout={size:sz,ox:(w-sz)/2,oy:Math.max(28,(availableH-sz)/2+((w<650)?105:25))};let s=sz/100;
let bg=ctx.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#e6b875');bg.addColorStop(.5,'#c98e51');bg.addColorStop(1,'#a96939');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
for(let i=0;i<220;i++){let x=noise(i*3)*w,y=noise(i*3+1)*h,r=(3+noise(i*3+2)*23)*s/6;ctx.fillStyle=i%3?'#f5cb8155':'#8e573522';ctx.beginPath();ctx.ellipse(x,y,r*2,r,noise(i)*6,0,7);ctx.fill()}
for(let i=0;i<18;i++){let x=(8+noise(i*5)*84)*s+layout.ox,y=(8+noise(i*5+1)*84)*s+layout.oy;ctx.fillStyle='#8c6447';for(let j=0;j<3;j++)ctx.fillRect(x+j*2*s,y-j*1.3*s,3*s,1.2*s)}
ctx.lineCap='round';E.forEach(([a,b],i)=>{let p=coord(a),q=coord(b);ctx.strokeStyle='#704b36';ctx.lineWidth=5.2*s;ctx.beginPath();ctx.moveTo(p.x,p.y+1*s);ctx.lineTo(q.x,q.y+1*s);ctx.stroke();ctx.strokeStyle='#e5c28b';ctx.lineWidth=3.8*s;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.strokeStyle='#fff0c66b';ctx.lineWidth=.55*s;ctx.setLineDash([1.3*s,1.2*s]);ctx.stroke();ctx.setLineDash([])});
Object.keys(P).forEach(id=>{let p=coord(id),portal=id.startsWith('V'),r=(portal?2.5:2.9)*s;stone(p.x,p.y,r,portal?'portal':'normal');if(portal){ctx.strokeStyle='#dcafff';ctx.lineWidth=.5*s;ctx.beginPath();ctx.arc(p.x,p.y,r*.43,0,Math.PI*1.7);ctx.stroke();ctx.fillStyle='#412356';ctx.beginPath();ctx.arc(p.x,p.y,r*.2,0,7);ctx.fill()}else{ctx.fillStyle='#483322';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 '+Math.max(9,2.8*s)+'px system-ui';ctx.fillText(id,p.x,p.y)}});
if(G.on){let opts=currentChoices();opts.forEach(id=>{let p=coord(id);ctx.strokeStyle='#fff27a';ctx.lineWidth=.55*s;ctx.beginPath();ctx.arc(p.x,p.y,4.3*s,0,7);ctx.stroke()});G.p.forEach((p,i)=>{let pt=coord(p.pos);if(animation?.i===i){let a=coord(animation.from),b=coord(animation.to),t=animation.t;pt={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t-Math.sin(t*Math.PI)*2*s}}if(p.b){let b=coord(p.b);ctx.fillStyle=i?'#a64b34':'#d49b4d';ctx.beginPath();ctx.ellipse(b.x,b.y,3.5*s,2.3*s,0,0,7);ctx.fill();ctx.strokeStyle='#70412d';ctx.lineWidth=.3*s;ctx.stroke()}ctx.shadowColor='#40201288';ctx.shadowBlur=1.5*s;ctx.font=Math.max(18,6*s)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🦊',pt.x,pt.y-2*s);ctx.shadowBlur=0;ctx.fillStyle=i?'#cf473b':'#338bd0';ctx.beginPath();ctx.arc(pt.x,pt.y+1.5*s,1.4*s,0,7);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=.3*s;ctx.stroke()});let goal=coord(me().g);ctx.strokeStyle='#5fffe0';ctx.lineWidth=.7*s;ctx.beginPath();ctx.arc(goal.x,goal.y,5*s,0,7);ctx.stroke();}
ctx.fillStyle='#5a331c';ctx.font='900 '+Math.max(17,Math.min(28,w*.04))+'px system-ui';ctx.textAlign='left';ctx.fillText('JEU VALIDE ! · RUINES DU SAHARA',12,h-((w<650)?70:15));
}
canvas.addEventListener('pointerup',e=>{if(!G.on||G.turn||G.moving)return;let s=layout.size/100,nearest=null,best=Infinity;for(let id of currentChoices()){let p=coord(id),dist=Math.hypot(p.x-e.clientX,p.y-e.clientY);if(dist<best){best=dist;nearest=id}}if(best<Math.max(19,5*s))choose(nearest)});
startBtn.addEventListener('click',startGame);x2.addEventListener('click',()=>{G.mode=G.mode==='x2'?null:'x2';G.xp=[];refresh()});bam.addEventListener('click',()=>{G.mode=G.mode==='bam'?null:'bam';refresh()});tele.addEventListener('click',()=>{G.mode=G.mode==='tele'?null:'tele';refresh()});pass.addEventListener('click',()=>{if(!legal(0).length)endTurn()});replay.addEventListener('click',()=>location.reload());addEventListener('resize',draw);draw();
</script></body></html>
