<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jeu Valide ! — Prototype 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091722;font-family:Arial,sans-serif;color:white;touch-action:none}*{box-sizing:border-box}#game{position:relative;width:100%;height:100%}#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.panel{background:rgba(5,15,25,.82);border:2px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);box-shadow:0 8px 25px rgba(0,0,0,.35)}#radarBox{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));width:190px;height:190px;border-radius:50%;overflow:hidden;border:4px solid rgba(255,255,255,.8);box-shadow:0 8px 25px rgba(0,0,0,.5)}#radar{width:100%;height:100%;background:#061725}#players{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));width:190px;border-radius:16px;padding:8px}.player{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:7px;padding:7px;margin:4px 0;background:rgba(255,255,255,.06);border-radius:10px;font-size:12px}.dot{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.45)}#goalBox{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:calc(82px + env(safe-area-inset-bottom));width:180px;padding:12px;border-radius:16px;text-align:center}.goalNum{font-size:38px;font-weight:900;color:#ffe23d}#message{position:absolute;left:50%;top:max(15px,env(safe-area-inset-top));transform:translateX(-50%);border-radius:25px;padding:9px 16px;font-weight:bold;font-size:13px;white-space:nowrap}#cameraHint{position:absolute;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 12px;border-radius:18px;font-size:11px;font-weight:700;pointer-events:none;opacity:.82;transition:opacity .35s}#powers{position:absolute;left:50%;transform:translateX(-50%);bottom:max(15px,env(safe-area-inset-bottom));display:flex;gap:7px;width:min(520px,94%)}button{flex:1;border:2px solid rgba(255,255,255,.2);background:rgba(7,18,28,.9);color:white;border-radius:12px;padding:12px 5px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}button.active{border-color:#ffe23d;box-shadow:0 0 18px rgba(255,226,61,.7)}#validate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,rgba(255,220,0,.28),transparent 55%)}#validate.show{display:flex}#validateText{font-size:50px;font-weight:1000;text-align:center;text-shadow:0 4px 0 #111,0 0 30px #ffd400;animation:pop .35s alternate infinite}#validateText span{display:block;color:#ffe23d;font-size:100px}@keyframes pop{from{transform:scale(.92)}to{transform:scale(1.08)}}@media(max-width:650px){#radarBox{width:135px;height:135px}#players{width:145px}.player{font-size:10px;padding:5px}.dot{width:20px;height:20px}#goalBox{width:140px;font-size:11px;bottom:calc(76px + env(safe-area-inset-bottom))}.goalNum{font-size:32px}button{font-size:10px;padding:10px 3px}#message{top:155px;font-size:11px;max-width:80%;overflow:hidden;text-overflow:ellipsis}#cameraHint{bottom:calc(67px + env(safe-area-inset-bottom));font-size:10px}#validateText{font-size:38px}#validateText span{font-size:82px}}
</style>
</head>
<body>
<div id="game">
<canvas id="view"></canvas>
<div id="radarBox"><canvas id="radar"></canvas></div>
<div id="message" class="panel">Clique sur une case bleue</div>
<div id="players" class="panel">
<div class="player"><div class="dot" style="background:#ffd21c"></div><div><b>Toi</b><br>Objectif 16</div><div>2/7</div></div>
<div class="player"><div class="dot" style="background:#e63737"></div><div><b>Bot rouge</b><br>Objectif ?</div><div>3/7</div></div>
<div class="player"><div class="dot" style="background:#3fc95e"></div><div><b>Bot vert</b><br>Objectif ?</div><div>1/7</div></div>
<div class="player"><div class="dot" style="background:#3585e8"></div><div><b>Bot bleu</b><br>Objectif ?</div><div>2/7</div></div>
</div>
<div id="goalBox" class="panel">TON OBJECTIF<div class="goalNum">16</div>Atteins cette case</div>
<div id="cameraHint" class="panel">↔ tourne · ↕ incline · 2 doigts = zoom</div>
<div id="powers"><button id="x2">⚡ X2</button><button id="bam">💥 BAM</button><button id="tele">🌀 VA OÙ TU VEUX</button><button id="pass">⏩ PASSER</button></div>
<div id="validate"><div id="validateText">JE VALIDE !<span>16</span></div></div>
</div>
<script>
const P={N:[50,4],E:[96,50],S:[50,96],W:[4,50],1:[38,92],2:[9,39],3:[61,8],4:[91,61],5:[27,88],6:[13,28],7:[71,12],8:[87,73],9:[13,73],10:[27,12],11:[87,28],12:[71,88],13:[9,61],14:[38,8],15:[91,39],16:[61,92],VNW:[18,18],VNE:[82,18],VSE:[82,82],VSW:[18,82],VT:[50,28],VR:[72,50],VB:[50,72],VL:[28,50],23:[41,31],18:[59,31],19:[69,41],20:[69,59],21:[59,69],17:[41,69],22:[31,59],24:[31,41],VTL:[35,35],VTR:[65,35],VBR:[65,65],VBL:[35,65],VIT:[50,42],VIR:[58,50],VIB:[50,58],VIL:[42,50],26:[45,45],27:[55,45],28:[55,55],25:[45,55]};
const EDGES=[['N','3'],['3','7'],['7','VNE'],['VNE','11'],['11','15'],['15','E'],['E','4'],['4','8'],['8','VSE'],['VSE','12'],['12','16'],['16','S'],['S','1'],['1','5'],['5','VSW'],['VSW','9'],['9','13'],['13','W'],['W','2'],['2','6'],['6','VNW'],['VNW','10'],['10','14'],['14','N'],['VNW','VT'],['VT','VNE'],['VNE','VR'],['VR','VSE'],['VSE','VB'],['VB','VSW'],['VSW','VL'],['VL','VNW'],['VT','23'],['23','VTL'],['VTL','24'],['24','VL'],['VT','18'],['18','VTR'],['VTR','19'],['19','VR'],['VR','20'],['20','VBR'],['VBR','21'],['21','VB'],['VB','17'],['17','VBL'],['VBL','22'],['22','VL'],['VTL','VIT'],['VTL','VIL'],['VTR','VIT'],['VTR','VIR'],['VBR','VIR'],['VBR','VIB'],['VBL','VIB'],['VBL','VIL'],['VIT','26'],['26','VIL'],['VIT','27'],['27','VIR'],['VIR','28'],['28','VIB'],['VIB','25'],['25','VIL']];
const ADJ={};Object.keys(P).forEach(k=>ADJ[k]=[]);EDGES.forEach(([a,b])=>{ADJ[a].push(b);ADJ[b].push(a)});
const view=document.getElementById('view'),ctx=view.getContext('2d'),radar=document.getElementById('radar'),rctx=radar.getContext('2d');let W=innerWidth,H=innerHeight;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;view.width=W*dpr;view.height=H*dpr;view.style.width=W+'px';view.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);const rw=radar.clientWidth,rh=radar.clientHeight;radar.width=rw*dpr;radar.height=rh*dpr;rctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);
const G={human:{pos:'S',color:'#ffd21c'},bots:[{pos:'N',color:'#e63737'},{pos:'E',color:'#3fc95e'},{pos:'W',color:'#3585e8'}],goal:'16',barriers:['20','6','23'],moving:false,from:null,to:null,t:0,yaw:0,targetYaw:0,yawVelocity:0,camHeight:7,targetCamHeight:7,camDistance:17,targetCamDistance:17,teleport:false};const clickable=[];
function world(id){return{x:(P[id][0]-50)*1.5,z:(P[id][1]-50)*1.5}}function lerp(a,b,t){return a+(b-a)*t}function humanWorld(){if(!G.moving)return world(G.human.pos);const a=world(G.from),b=world(G.to);let t=G.t;t=t*t*(3-2*t);return{x:lerp(a.x,b.x,t),z:lerp(a.z,b.z,t)}}
function angleDelta(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}
function camera(){const p=humanWorld(),fx=Math.sin(G.yaw),fz=-Math.cos(G.yaw);return{x:p.x-fx*G.camDistance,z:p.z-fz*G.camDistance,h:G.camHeight,fx,fz,rx:Math.cos(G.yaw),rz:Math.sin(G.yaw)}}
function project(p,c){const dx=p.x-c.x,dz=p.z-c.z,side=dx*c.rx+dz*c.rz,depth=dx*c.fx+dz*c.fz;if(depth<=1)return null;const f=Math.min(W,H)*1.05;return{x:W/2+side*f/depth,y:H*.43+c.h*f/depth,depth}}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#238fd4');g.addColorStop(.5,'#8dd7ff');g.addColorStop(.57,'#e9faff');g.addColorStop(1,'#07131d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.65)';for(let i=0;i<10;i++){const x=(i*181+70)%W,y=80+(i%3)*55;ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.arc(x+28,y+8,21,0,Math.PI*2);ctx.arc(x-25,y+10,19,0,Math.PI*2);ctx.fill()}}
function nodeColor(id){if(id===G.goal)return'#ffe23d';if(id.startsWith('V'))return'#a049dc';if(['N','E','S','W'].includes(id))return'#ddd';const n=Number(id),colors=['#e74d45','#448fe5','#43c663','#e7c939'];return colors[n%4]}
function drawBoard(){const c=camera();clickable.length=0;EDGES.forEach(([a,b])=>{const A=project(world(a),c),B=project(world(b),c);if(!A||!B)return;ctx.strokeStyle='#39424a';ctx.lineWidth=Math.max(4,170/((A.depth+B.depth)/2));ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke()});const nodes=[];Object.keys(P).forEach(id=>{const p=project(world(id),c);if(p)nodes.push({id,...p})});nodes.sort((a,b)=>b.depth-a.depth);nodes.forEach(n=>{const s=Math.max(8,Math.min(48,680/n.depth)),reachable=G.teleport||ADJ[G.human.pos].includes(n.id);ctx.save();ctx.translate(n.x,n.y);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,s*.32,s,s*.45,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=reachable?18:0;ctx.shadowColor='#42cfff';ctx.fillStyle=nodeColor(n.id);ctx.strokeStyle=reachable?'#5ee0ff':'rgba(255,255,255,.35)';ctx.lineWidth=reachable?5:2;ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6,x=Math.cos(a)*s,y=Math.sin(a)*s*.55;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;if(!n.id.startsWith('V')){ctx.fillStyle='#111';ctx.font=`bold ${Math.max(10,s*.48)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.id,0,0)}ctx.restore();clickable.push({id:n.id,x:n.x,y:n.y,r:s*1.5})});drawBarriers(c);drawBots(c);drawHuman(c);drawGoal(c)}
function pawn(pos,color,c,size=1){const p=project(pos,c);if(!p)return;const s=Math.max(10,Math.min(70,850/p.depth))*size;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,s*.2,s*.55,s*.22,0,0,Math.PI*2);ctx.fill();const grad=ctx.createLinearGradient(-s,-s,s,s);grad.addColorStop(0,'#fff');grad.addColorStop(.18,color);grad.addColorStop(1,'#222');ctx.fillStyle=grad;ctx.globalAlpha=.84;ctx.beginPath();ctx.moveTo(-s*.35,0);ctx.quadraticCurveTo(-s*.28,-s*.72,0,-s*.72);ctx.quadraticCurveTo(s*.28,-s*.72,s*.35,0);ctx.closePath();ctx.fill();ctx.beginPath();ctx.arc(0,-s*.9,s*.28,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawHuman(c){pawn(humanWorld(),G.human.color,c,1.15)}function drawBots(c){G.bots.forEach(b=>pawn(world(b.pos),b.color,c,.8))}function drawBarriers(c){G.barriers.forEach(id=>{const p=project(world(id),c);if(!p)return;const s=Math.max(12,Math.min(55,650/p.depth));ctx.save();ctx.translate(p.x,p.y-s*.25);ctx.globalAlpha=.72;ctx.fillStyle='#20252b';ctx.strokeStyle='#bbb';ctx.lineWidth=3;ctx.fillRect(-s*.55,-s*.75,s*1.1,s*.8);ctx.strokeRect(-s*.55,-s*.75,s*1.1,s*.8);ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(-s*.25,-s*.57);ctx.lineTo(s*.25,-s*.18);ctx.moveTo(s*.25,-s*.57);ctx.lineTo(-s*.25,-s*.18);ctx.stroke();ctx.restore()})}
function drawGoal(c){const p=project(world(G.goal),c);if(!p)return;const grad=ctx.createLinearGradient(p.x,p.y-280,p.x,p.y);grad.addColorStop(0,'rgba(255,220,20,0)');grad.addColorStop(1,'rgba(255,220,20,.8)');ctx.fillStyle=grad;ctx.fillRect(p.x-9,p.y-280,18,280)}
function drawRadar(){const w=radar.clientWidth,h=radar.clientHeight;rctx.clearRect(0,0,w,h);rctx.fillStyle='#061725';rctx.fillRect(0,0,w,h);rctx.strokeStyle='rgba(90,175,220,.2)';for(let i=1;i<=3;i++){rctx.beginPath();rctx.arc(w/2,h/2,w*.12*i,0,Math.PI*2);rctx.stroke()}rctx.beginPath();rctx.moveTo(w/2,0);rctx.lineTo(w/2,h);rctx.moveTo(0,h/2);rctx.lineTo(w,h/2);rctx.stroke();const rp=id=>({x:P[id][0]/100*w,y:P[id][1]/100*h});rctx.strokeStyle='rgba(120,190,220,.28)';EDGES.forEach(([a,b])=>{const A=rp(a),B=rp(b);rctx.beginPath();rctx.moveTo(A.x,A.y);rctx.lineTo(B.x,B.y);rctx.stroke()});Object.keys(P).forEach(id=>{const p=rp(id);rctx.fillStyle=id.startsWith('V')?'#9848d4':'#617989';rctx.beginPath();rctx.arc(p.x,p.y,2,0,Math.PI*2);rctx.fill()});const goal=rp(G.goal);rctx.fillStyle='#ffe23d';rctx.beginPath();rctx.arc(goal.x,goal.y,6,0,Math.PI*2);rctx.fill();G.barriers.forEach(id=>{const p=rp(id);rctx.fillStyle='#111';rctx.fillRect(p.x-4,p.y-4,8,8)});G.bots.forEach(bot=>{const p=rp(bot.pos);rctx.fillStyle=bot.color;rctx.beginPath();rctx.arc(p.x,p.y,5,0,Math.PI*2);rctx.fill()});const hp=rp(G.human.pos);rctx.fillStyle='#ffd21c';rctx.strokeStyle='#fff';rctx.lineWidth=2;rctx.beginPath();rctx.arc(hp.x,hp.y,7,0,Math.PI*2);rctx.fill();rctx.stroke();const a=G.yaw-Math.PI/2;rctx.strokeStyle='#ffe23d';rctx.lineWidth=2;rctx.beginPath();rctx.moveTo(hp.x,hp.y);rctx.lineTo(hp.x+Math.cos(a)*16,hp.y+Math.sin(a)*16);rctx.stroke()}
function move(id){if(G.moving)return;if(!G.teleport&&!ADJ[G.human.pos].includes(id))return;if(G.bots.some(b=>b.pos===id))return;if(G.barriers.includes(id)){document.getElementById('message').textContent='Cette case est bloquée par un barrage';return}G.from=G.human.pos;G.to=id;G.t=0;G.moving=true;G.teleport=false;document.getElementById('tele').classList.remove('active');document.getElementById('message').textContent='Déplacement…'}
function hitAt(x,y){let best=null,bestD=Infinity;clickable.forEach(c=>{const d=Math.hypot(x-c.x,y-c.y);if(d<c.r&&d<bestD){best=c;bestD=d}});if(best)move(best.id)}
const touches=new Map();let drag=null,pinch=null;
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){drag={id:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,lastT:performance.now(),moved:false};G.yawVelocity=0}else if(touches.size===2){const pts=[...touches.values()];pinch={dist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),startDistance:G.targetCamDistance};drag.moved=true}});
view.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2&&pinch){const pts=[...touches.values()],d=Math.max(20,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y));G.targetCamDistance=Math.max(11,Math.min(28,pinch.startDistance*(pinch.dist/d)));document.getElementById('cameraHint').style.opacity='.2';return}if(!drag||drag.id!==e.pointerId)return;const now=performance.now(),dx=e.clientX-drag.lastX,dy=e.clientY-drag.lastY,dt=Math.max(8,now-drag.lastT);if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>7)drag.moved=true;if(drag.moved){const sensitivity=0.0062;G.targetYaw-=dx*sensitivity;G.yawVelocity=(-dx*sensitivity)/(dt/16.67);G.targetCamHeight=Math.max(4.5,Math.min(12.5,G.targetCamHeight+dy*0.023));document.getElementById('cameraHint').style.opacity='.2'}drag.lastX=e.clientX;drag.lastY=e.clientY;drag.lastT=now});
function releasePointer(e){const wasDrag=drag&&drag.id===e.pointerId,wasMoved=wasDrag&&drag.moved;touches.delete(e.pointerId);if(touches.size<2)pinch=null;if(wasDrag){if(!wasMoved&&!G.moving){const r=view.getBoundingClientRect();hitAt(e.clientX-r.left,e.clientY-r.top)}drag=null}if(touches.size===1){const [id,p]=[...touches.entries()][0];drag={id,startX:p.x,startY:p.y,lastX:p.x,lastY:p.y,lastT:performance.now(),moved:true}}}
view.addEventListener('pointerup',releasePointer);view.addEventListener('pointercancel',releasePointer);
document.getElementById('tele').onclick=()=>{G.teleport=!G.teleport;document.getElementById('tele').classList.toggle('active',G.teleport);document.getElementById('message').textContent=G.teleport?"Choisis n'importe quelle case libre":'Clique sur une case bleue'};document.getElementById('x2').onclick=()=>document.getElementById('message').textContent='X2 : prochaine étape, reconnexion à la logique complète';document.getElementById('bam').onclick=()=>document.getElementById('message').textContent='BAM : prochaine étape, reconnexion à la logique complète';document.getElementById('pass').onclick=()=>document.getElementById('message').textContent='Tour passé';
function validate(){const el=document.getElementById('validate');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}
function update(dt){if(!drag&&Math.abs(G.yawVelocity)>.0001){G.targetYaw+=G.yawVelocity*(dt/16.67);G.yawVelocity*=Math.pow(.90,dt/16.67)}G.yaw+=angleDelta(G.yaw,G.targetYaw)*Math.min(1,dt*.018);G.camHeight+=(G.targetCamHeight-G.camHeight)*Math.min(1,dt*.012);G.camDistance+=(G.targetCamDistance-G.camDistance)*Math.min(1,dt*.014);if(!G.moving)return;G.t+=dt/430;if(G.t>=1){G.t=1;G.human.pos=G.to;G.moving=false;document.getElementById('message').textContent='Clique sur une case bleue';if(G.human.pos===G.goal)validate()}}
let last=performance.now();function loop(now){const dt=Math.min(40,now-last);last=now;update(dt);drawSky();drawBoard();drawRadar();requestAnimationFrame(loop)}requestAnimationFrame(loop);setTimeout(()=>document.getElementById('cameraHint').style.opacity='.35',5000);
</script>
</body>
</html>
