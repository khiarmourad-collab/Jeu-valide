const A={};Object.keys(P).forEach(k=>A[k]=[]);E.forEach(([a,b])=>{A[a].push(b);A[b].push(a)});const cv=view,c=cv.getContext('2d'),rc=radar.getContext('2d');let W,H,D=1,hits=[];function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;c.setTransform(D,0,0,D,0,0);let w=radar.clientWidth,h=radar.clientHeight;radar.width=w*D;radar.height=h*D;rc.setTransform(D,0,0,D,0,0)}resize();onresize=resize;
const G={on:false,p:[],turn:0,deck:[],phase:'move',mode:null,xp:[],moving:false,from:null,to:null,t:0,owner:0,view:'3d',radar:true,yaw:0,tyaw:0,cam:20,tcam:20,height:13,theight:13};const col=['#f3c341','#e85b3e'];const me=()=>G.p[0],bot=()=>G.p[1];function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function occ(id,ex=-1){return G.p.some((p,i)=>i!==ex&&p.pos===id)}function barr(id){return G.p.findIndex(p=>p.b===id)}function blocked(id,i){let b=barr(id);return occ(id,i)||(b>=0&&b!==i)}function legal(i,from=G.p[i].pos){return A[from].filter(n=>!blocked(n,i))}function path(s,g,i){let q=[[s]],seen=new Set([s]);while(q.length){let p=q.shift(),x=p[p.length-1];if(x===g)return p;for(let n of A[x])if(!seen.has(n)&&!blocked(n,i)){seen.add(n);q.push([...p,n])}}return null}function goal(i){let ok=G.deck.filter(n=>{let b=barr(String(n));return b<0||b===i}),pool=ok.length?ok:G.deck;if(!pool.length)return null;let n=pool[Math.floor(Math.random()*pool.length)];G.deck.splice(G.deck.indexOf(n),1);return String(n)}function bh(id){let dx=P[id][0]-50,dy=P[id][1]-50,r=Math.min(1,Math.hypot(dx,dy)/65);return 14*r*r}function world(id){return{x:(P[id][0]-50)*1.45,z:(P[id][1]-50)*1.45,y:bh(id)}}function lerp(a,b,t){return a+(b-a)*t}function hworld(){if(G.moving&&G.owner===0){let a=world(G.from),b=world(G.to),t=G.t*G.t*(3-2*G.t);return{x:lerp(a.x,b.x,t),z:lerp(a.z,b.z,t),y:lerp(a.y,b.y,t)}}return world(me().pos)}function camera(){let p=hworld(),fx=Math.sin(G.yaw),fz=-Math.cos(G.yaw);return{x:p.x-fx*G.cam,z:p.z-fz*G.cam,h:p.y+G.height,fx,fz,rx:Math.cos(G.yaw),rz:Math.sin(G.yaw)}}function proj(p,k){let dx=p.x-k.x,dz=p.z-k.z,side=dx*k.rx+dz*k.rz,dep=dx*k.fx+dz*k.fz;if(dep<=1)return null;let f=Math.min(W,H)*1.12;return{x:W/2+side*f/dep,y:H*.37+(k.h-(p.y||0))*f/dep,d:dep}}
function badge(t,on){return `<span class="a ${on?'':'used'}">${on?'✓':'✕'} ${t}</span>`}function refresh(){if(!G.on)return;players.innerHTML=G.p.map((p,i)=>`<div class="pl"><div class="foxicon">🦊</div><div><b>${i?'Fennec rouge':'Ton fennec'}</b><br>${i?'Oasis ?':'Oasis '+p.g}</div><div>${p.s}/14</div>${i?`<div class="atouts">${badge('SPRINT',p.pow.x2)}${badge('CREUSE',p.pow.bam)}${badge('TERRIER',p.pow.tele)}</div>`:''}</div>`).join('');gnum.textContent=me().g||'-';phase.textContent=G.turn?'Tour du rival':G.phase==='barrier'?(me().b?'Déplace ta dune':'Pose ta dune'):'À toi';msg.textContent=G.turn?'Le fennec rival cherche son oasis…':G.phase==='barrier'?(me().b?'Déplace ta dune de sable':'Place une dune de sable'):'Choisis le prochain bond de ton fennec';['x2','bam','tele'].forEach(k=>document.getElementById(k).disabled=G.turn||G.phase!=='move'||!me().pow[k]);pass.disabled=G.turn||G.phase!=='move'||legal(0).length>0;['x2','bam','tele'].forEach(k=>document.getElementById(k).classList.toggle('active',G.mode===k));vbtn.textContent=G.view==='3d'?'🗺️ 2D':'🎥 3D';rbtn.textContent=G.radar?'📡 MASQUER':'📡 AFFICHER';radarBox.classList.toggle('off',!G.radar)}function start(){G.deck=shuffle([...Array(28)].map((_,i)=>i+1));G.p=[{pos:'S',s:0,g:null,b:null,pow:{x2:1,bam:1,tele:1},face:Math.PI},{pos:'N',s:0,g:null,b:null,pow:{x2:1,bam:1,tele:1},face:0}];G.p.forEach((p,i)=>p.g=goal(i));G.turn=Math.random()<.5?0:1;G.phase='move';G.on=true;document.getElementById('start').classList.add('hidden');refresh();if(G.turn)setTimeout(botTurn,700)}
function select(id){if(G.turn||G.moving)return false;if(G.phase==='barrier')return !occ(id)&&barr(id)<0&&id!==me().b;if(G.mode==='tele')return !occ(id,0)&&barr(id)<0;if(G.mode==='bam')return A[me().pos].includes(id)&&barr(id)===1&&bot().pos!==id;if(G.mode==='x2'){let f=G.xp.length?G.xp[G.xp.length-1]:me().pos;return A[f].includes(id)&&!blocked(id,0)}return legal(0).includes(id)}
function sky(){let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3697cf');g.addColorStop(.42,'#9fd7e5');g.addColorStop(.68,'#f0c271');g.addColorStop(1,'#a65c2c');c.fillStyle=g;c.fillRect(0,0,W,H);let sx=W*.78,sy=H*.15,sg=c.createRadialGradient(sx,sy,4,sx,sy,58);sg.addColorStop(0,'#fff8c8');sg.addColorStop(.35,'#ffd978');sg.addColorStop(1,'rgba(255,205,91,0)');c.fillStyle=sg;c.beginPath();c.arc(sx,sy,58,0,7);c.fill();c.fillStyle='rgba(105,63,32,.25)';for(let i=0;i<6;i++){let y=H*(.29+i*.018);c.beginPath();c.moveTo(0,y);for(let x=0;x<=W;x+=W/8)c.lineTo(x,y+Math.sin(x*.012+i)*7);c.lineTo(W,H*.52);c.lineTo(0,H*.52);c.fill()}}

function fox(p,color,k,size=1){let q=proj(p,k);if(!q)return;let s=Math.max(13,Math.min(62,760/q.d))*size,bob=G.moving?Math.sin(G.t*Math.PI)*s*.28:0;c.save();c.translate(q.x,q.y-s*.15-bob);c.strokeStyle='#5a2b15';c.lineWidth=Math.max(1,s*.05);c.fillStyle=color;c.beginPath();c.ellipse(0,-s*.18,s*.48,s*.28,-.08,0,7);c.fill();c.stroke();c.beginPath();c.moveTo(-s*.22,-s*.42);c.lineTo(-s*.43,-s*1.22);c.lineTo(-s*.04,-s*.63);c.lineTo(s*.04,-s*.63);c.lineTo(s*.43,-s*1.22);c.lineTo(s*.22,-s*.42);c.closePath();c.fill();c.stroke();c.beginPath();c.arc(0,-s*.55,s*.3,0,7);c.fill();c.stroke();c.beginPath();c.moveTo(s*.38,-s*.18);c.quadraticCurveTo(s*.95,-s*.55,s*1.08,-s*.12);c.quadraticCurveTo(s*.85,s*.05,s*.42,0);c.fill();c.stroke();c.fillStyle='#fff1cf';c.beginPath();c.moveTo(-s*.31,-s*.55);c.lineTo(-s*.38,-s*1.05);c.lineTo(-s*.12,-s*.64);c.moveTo(s*.31,-s*.55);c.lineTo(s*.38,-s*1.05);c.lineTo(s*.12,-s*.64);c.fill();c.fillStyle='#20140d';c.beginPath();c.arc(-s*.11,-s*.6,s*.035,0,7);c.arc(s*.11,-s*.6,s*.035,0,7);c.arc(0,-s*.43,s*.045,0,7);c.fill();c.restore()}
