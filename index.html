}
canvas.addEventListener('pointerup',e=>{if(!G.on||G.turn||G.moving)return;let s=layout.size/100,nearest=null,best=Infinity;for(let id of currentChoices()){let p=coord(id),dist=Math.hypot(p.x-e.clientX,p.y-e.clientY);if(dist<best){best=dist;nearest=id}}if(best<Math.max(19,5*s))choose(nearest)});
startBtn.addEventListener('click',startGame);x2.addEventListener('click',()=>{G.mode=G.mode==='x2'?null:'x2';G.xp=[];refresh()});bam.addEventListener('click',()=>{G.mode=G.mode==='bam'?null:'bam';refresh()});tele.addEventListener('click',()=>{G.mode=G.mode==='tele'?null:'tele';refresh()});pass.addEventListener('click',()=>{if(!legal(0).length)endTurn()});replay.addEventListener('click',()=>location.reload());addEventListener('resize',draw);draw();
</script></body></html>
