<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jeu Valide ! — 3D jouable</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091722;font-family:Arial,sans-serif;color:white;touch-action:none}*{box-sizing:border-box}#game{position:relative;width:100%;height:100%}#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.panel{background:rgba(5,15,25,.84);border:2px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);box-shadow:0 8px 25px rgba(0,0,0,.35)}#radarBox{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:150px;height:150px;border-radius:50%;overflow:hidden;border:3px solid #fff}#radar{width:100%;height:100%}#players{position:absolute;right:12px;top:12px;width:155px;border-radius:14px;padding:7px}.player{display:grid;grid-template-columns:20px 1fr auto;gap:5px;align-items:center;padding:6px;font-size:11px}.dot{width:18px;height:18px;border-radius:50%}#goalBox{position:absolute;right:12px;bottom:75px;width:140px;padding:8px;border-radius:14px;text-align:center;font-size:10px}.goalNum{font-size:32px;font-weight:900;color:#ffe23d}#message{position:absolute;left:50%;top:15px;transform:translateX(-50%);border-radius:22px;padding:8px 13px;font-weight:bold;font-size:12px;max-width:45%;text-align:center}#powers{position:absolute;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:6px;width:min(560px,96%)}button{flex:1;border:2px solid rgba(255,255,255,.2);background:rgba(7,18,28,.92);color:white;border-radius:11px;padding:11px 3px;font-weight:800;font-size:11px}button.active{border-color:#ffe23d;box-shadow:0 0 15px #ffe23d}button:disabled{opacity:.35}#validate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,rgba(255,220,0,.3),transparent 55%)}#validate.show{display:flex}#validateText{font-size:48px;font-weight:1000;text-align:center;text-shadow:0 4px #111,0 0 30px #ffd400;animation:pop .35s alternate infinite}#validateText span{display:block;color:#ffe23d;font-size:95px}@keyframes pop{to{transform:scale(1.08)}}#start,#end{position:absolute;inset:0;z-index:20;background:rgba(3,10,18,.9);display:flex;align-items:center;justify-content:center}.card{width:min(390px,90%);padding:25px;border-radius:22px;text-align:center}.card h1{margin:0 0 8px;font-size:32px}.card button{margin-top:14px;width:100%;padding:15px;background:#ffd21c;color:#111}.hidden{display:none!important}@media(max-width:650px){#radarBox{width:125px;height:125px}#players{width:135px}.player{font-size:9px}#message{top:140px;max-width:80%;font-size:10px}#goalBox{width:125px}.goalNum{font-size:28px}button{font-size:9px;padding:10px 2px}}</style></head><body><div id="game"><canvas id="view"></canvas><div id="radarBox"><canvas id="radar"></canvas></div><div id="message" class="panel"></div><div id="players" class="panel"></div><div id="goalBox" class="panel">TON OBJECTIF<div class="goalNum" id="goalNum">?</div><span id="phaseText"></span></div><div id="powers"><button id="x2">⚡ X2</button><button id="bam">💥 BAM</button><button id="tele">🌀 VA OÙ TU VEUX</button><button id="pass">⏩ PASSER</button></div><div id="validate"><div id="validateText">JE VALIDE !<span id="valNum"></span></div></div><div id="start"><div class="card panel"><h1>JEU VALIDE !</h1><p>Version 3D jouable · Toi contre le bot</p><button id="startBtn">COMMENCER</button></div></div><div id="end" class="hidden"><div class="card panel"><h1 id="winner"></h1><p id="finalScore"></p><button onclick="location.reload()">REJOUER</button></div></div></div><script>
const P={N:[50,4],E:[96,50],S:[50,96],W:[4,50],1:[38,92],2:[9,39],3:[61,8],4:[91,61],5:[27,88],6:[13,28],7:[71,12],8:[87,73],9:[13,73],10:[27,12],11:[87,28],12:[71,88],13:[9,61],14:[38,8],15:[91,39],16:[61,92],VNW:[18,18],VNE:[82,18],VSE:[82,82],VSW:[18,82],VT:[50,28],VR:[72,50],VB:[50,72],VL:[28,50],23:[41,31],18:[59,31],19:[69,41],20:[69,59],21:[59,69],17:[41,69],22:[31,59],24:[31,41],VTL:[35,35],VTR:[65,35],VBR:[65,65],VBL:[35,65],VIT:[50,42],VIR:[58,50],VIB:[50,58],VIL:[42,50],26:[45,45],27:[55,45],28:[55,55],25:[45,55]};
const EDGES=[['N','3'],['3','7'],['7','VNE'],['VNE','11'],['11','15'],['15','E'],['E','4'],['4','8'],['8','VSE'],['VSE','12'],['12','16'],['16','S'],['S','1'],['1','5'],['5','VSW'],['VSW','9'],['9','13'],['13','W'],['W','2'],['2','6'],['6','VNW'],['VNW','10'],['10','14'],['14','N'],['VNW','VT'],['VT','VNE'],['VNE','VR'],['VR','VSE'],['VSE','VB'],['VB','VSW'],['VSW','VL'],['VL','VNW'],['VT','23'],['23','VTL'],['VTL','24'],['24','VL'],['VT','18'],['18','VTR'],['VTR','19'],['19','VR'],['VR','20'],['20','VBR'],['VBR','21'],['21','VB'],['VB','17'],['17','VBL'],['VBL','22'],['22','VL'],['VTL','VIT'],['VTL','VIL'],['VTR','VIT'],['VTR','VIR'],['VBR','VIR'],['VBR','VIB'],['VBL','VIB'],['VBL','VIL'],['VIT','26'],['26','VIL'],['VIT','27'],['27','VIR'],['VIR','28'],['28','VIB'],['VIB','25'],['25','VIL']];
const ADJ={};Object.keys(P).forEach(k=>ADJ[k]=[]);EDGES.forEach(([a,b])=>{ADJ[a].push(b);ADJ[b].push(a)});const view=document.getElementById('view'),ctx=view.getContext('2d'),radar=document.getElementById('radar'),rctx=radar.getContext('2d');let W,H,clickable=[];function resize(){let d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;view.width=W*d;view.height=H*d;ctx.setTransform(d,0,0,d,0,0);let rw=radar.clientWidth,rh=radar.clientHeight;radar.width=rw*d;radar.height=rh*d;rctx.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize);
const G={started:false,players:[],turn:0,deck:[],phase:'move',mode:null,moving:false,from:null,to:null,t:0,moveOwner:null,yaw:0,targetYaw:0,yawVelocity:0,camHeight:7,targetCamHeight:7,camDistance:17,targetCamDistance:17,x2Path:[],bamTarget:null};const colors=['#ffd21c','#e63737'];function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function player(i){return G.players[i]}function me(){return player(0)}function bot(){return player(1)}function world(id){return{x:(P[id][0]-50)*1.5,z:(P[id][1]-50)*1.5}}function lerp(a,b,t){return a+(b-a)*t}function occupied(id,except=-1){return G.players.some((p,i)=>i!==except&&p.pos===id)}function barrierAt(id){return G.players.findIndex(p=>p.barriers.includes(id))}function blockedFor(id,pi){let b=barrierAt(id);return occupied(id,pi)||(b>=0&&b!==pi)}function legal(pi,from=player(pi).pos){return ADJ[from].filter(id=>!blockedFor(id,pi))}function drawGoal(pi){let blocked=G.deck.filter(n=>barrierAt(String(n))>=0&&barrierAt(String(n))!==pi);let choices=G.deck.filter(n=>!blocked.includes(n));let pool=choices.length?choices:G.deck;if(!pool.length)return null;let n=pool[Math.floor(Math.random()*pool.length)];G.deck.splice(G.deck.indexOf(n),1);return String(n)}function shortest(start,goal,pi){let q=[[start]],seen=new Set([start]);while(q.length){let path=q.shift(),x=path.at(-1);if(x===goal)return path;for(let n of ADJ[x])if(!seen.has(n)&&!blockedFor(n,pi)){seen.add(n);q.push([...path,n])}}return null}
function startGame(){G.deck=shuffle(Array.from({length:28},(_,i)=>i+1));G.players=[{name:'Toi',pos:'S',color:colors[0],score:0,goal:null,barriers:[],barriersLeft:4,powers:{x2:true,bam:true,tele:true}},{name:'Bot',pos:'N',color:colors[1],score:0,goal:null,barriers:[],barriersLeft:4,powers:{x2:true,bam:true,tele:true}}];G.players.forEach((p,i)=>p.goal=drawGoal(i));G.turn=Math.random()<.5?0:1;G.phase='move';G.started=true;document.getElementById('start').classList.add('hidden');refresh();if(G.turn===1)setTimeout(botTurn,900)}
function refresh(){document.getElementById('players').innerHTML=G.players.map((p,i)=>`<div class="player"><div class="dot" style="background:${p.color}"></div><div><b>${p.name}</b><br>${i===0?'Objectif '+p.goal:'Objectif ?'}</div><div>${p.score}/14</div></div>`).join('');document.getElementById('goalNum').textContent=me().goal||'-';document.getElementById('phaseText').textContent=G.turn===0?(G.phase==='move'?'À toi de jouer':G.phase==='barrier'?'Place ton barrage':''):'Tour du bot';let msg=G.turn===0?(G.phase==='move'?'Choisis ton déplacement':'Choisis une case libre pour ton barrage'):'Le bot joue…';document.getElementById('message').textContent=msg;for(let k of ['x2','bam','tele'])document.getElementById(k).disabled=G.turn!==0||G.phase!=='move'||!me().powers[k];document.getElementById('pass').disabled=G.turn!==0||G.phase!=='move'||legal(0).length>0;['x2','bam','tele'].forEach(k=>document.getElementById(k).classList.toggle('active',G.mode===k))}
function humanWorld(){if(G.moving&&G.moveOwner===0){let a=world(G.from),b=world(G.to),t=G.t*G.t*(3-2*G.t);return{x:lerp(a.x,b.x,t),z:lerp(a.z,b.z,t)}}return world(me().pos)}function camera(){let p=humanWorld(),fx=Math.sin(G.yaw),fz=-Math.cos(G.yaw);return{x:p.x-fx*G.camDistance,z:p.z-fz*G.camDistance,h:G.camHeight,fx,fz,rx:Math.cos(G.yaw),rz:Math.sin(G.yaw)}}function project(p,c){let dx=p.x-c.x,dz=p.z-c.z,side=dx*c.rx+dz*c.rz,depth=dx*c.fx+dz*c.fz;if(depth<=1)return null;let f=Math.min(W,H)*1.05;return{x:W/2+side*f/depth,y:H*.43+c.h*f/depth,depth}}
function nodeColor(id){if(id===me().goal)return'#ffe23d';if(id.startsWith('V'))return'#a049dc';if(['N','E','S','W'].includes(id))return'#ddd';return ['#e74d45','#448fe5','#43c663','#e7c939'][Number(id)%4]}function selectable(id){if(G.turn!==0||G.moving)return false;if(G.phase==='barrier')return !occupied(id)&&barrierAt(id)<0;if(G.mode==='tele')return !occupied(id,0)&&barrierAt(id)<0;if(G.mode==='bam')return ADJ[me().pos].includes(id)&&barrierAt(id)===1&&bot().pos!==id;if(G.mode==='x2'){let from=G.x2Path.length?G.x2Path.at(-1):me().pos;return ADJ[from].includes(id)&&!blockedFor(id,0)}return G.phase==='move'&&legal(0).includes(id)}
function drawSky(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#238fd4');g.addColorStop(.55,'#a9e1ff');g.addColorStop(1,'#07131d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}function pawn(pos,color,c,size=1){let p=project(pos,c);if(!p)return;let s=Math.max(10,Math.min(70,850/p.depth))*size;ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=.84;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-s*.35,0);ctx.quadraticCurveTo(-s*.25,-s*.7,0,-s*.7);ctx.quadraticCurveTo(s*.25,-s*.7,s*.35,0);ctx.closePath();ctx.fill();ctx.beginPath();ctx.arc(0,-s*.88,s*.27,0,Math.PI*2);ctx.fill();ctx.restore()}function drawBoard(){let c=camera();clickable=[];EDGES.forEach(([a,b])=>{let A=project(world(a),c),B=project(world(b),c);if(!A||!B)return;ctx.strokeStyle='#39424a';ctx.lineWidth=Math.max(4,170/((A.depth+B.depth)/2));ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke()});let nodes=[];Object.keys(P).forEach(id=>{let p=project(world(id),c);if(p)nodes.push({id,...p})});nodes.sort((a,b)=>b.depth-a.depth).forEach(n=>{let s=Math.max(8,Math.min(48,680/n.depth)),sel=selectable(n.id);ctx.save();ctx.translate(n.x,n.y);ctx.shadowBlur=sel?18:0;ctx.shadowColor='#5ee0ff';ctx.fillStyle=nodeColor(n.id);ctx.strokeStyle=sel?'#5ee0ff':'rgba(255,255,255,.35)';ctx.lineWidth=sel?5:2;ctx.beginPath();for(let i=0;i<6;i++){let a=Math.PI/3*i+Math.PI/6,x=Math.cos(a)*s,y=Math.sin(a)*s*.55;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.stroke();if(!n.id.startsWith('V')){ctx.fillStyle='#111';ctx.font=`bold ${Math.max(10,s*.48)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.id,0,0)}ctx.restore();clickable.push({id:n.id,x:n.x,y:n.y,r:s*1.5})});G.players.forEach((pl,i)=>pl.barriers.forEach(id=>{let p=project(world(id),c);if(!p)return;let s=Math.max(12,Math.min(50,650/p.depth));ctx.save();ctx.translate(p.x,p.y-s*.2);ctx.globalAlpha=.7;ctx.fillStyle=pl.color;ctx.fillRect(-s*.5,-s*.7,s,s*.7);ctx.strokeStyle='#fff';ctx.strokeRect(-s*.5,-s*.7,s,s*.7);ctx.restore()}));G.players.forEach((pl,i)=>pawn(i===0?humanWorld():world(pl.pos),pl.color,c,i===0?1.15:.9));}
function drawRadar(){let w=radar.clientWidth,h=radar.clientHeight;rctx.clearRect(0,0,w,h);rctx.fillStyle='#061725';rctx.fillRect(0,0,w,h);let rp=id=>({x:P[id][0]/100*w,y:P[id][1]/100*h});rctx.strokeStyle='#31566a';EDGES.forEach(([a,b])=>{let A=rp(a),B=rp(b);rctx.beginPath();rctx.moveTo(A.x,A.y);rctx.lineTo(B.x,B.y);rctx.stroke()});G.players.forEach(pl=>pl.barriers.forEach(id=>{let p=rp(id);rctx.fillStyle=pl.color;rctx.fillRect(p.x-3,p.y-3,6,6)}));G.players.forEach(pl=>{let p=rp(pl.pos);rctx.fillStyle=pl.color;rctx.beginPath();rctx.arc(p.x,p.y,6,0,Math.PI*2);rctx.fill()});let g=rp(me().goal);rctx.fillStyle='#ffe23d';rctx.beginPath();rctx.arc(g.x,g.y,5,0,Math.PI*2);rctx.fill()}
function animateMove(pi,id,cb){G.from=player(pi).pos;G.to=id;G.t=0;G.moveOwner=pi;G.moving=true;G.moveDone=()=>{player(pi).pos=id;G.moving=false;cb&&cb()}}
function validateIfNeeded(pi,cb){let p=player(pi);if(p.pos!==p.goal){cb();return}let n=p.goal;p.score++;if(pi===0){document.getElementById('valNum').textContent=n;document.getElementById('validate').classList.add('show');setTimeout(()=>document.getElementById('validate').classList.remove('show'),2200)}if(p.score>=14){endGame(pi);return}p.goal=drawGoal(pi);refresh();setTimeout(cb,pi===0?2250:450)}function afterMovement(pi){validateIfNeeded(pi,()=>{if(player(pi).barriersLeft>0){G.phase='barrier';refresh();if(pi===1)setTimeout(botBarrier,450)}else endTurn()})}function endTurn(){G.mode=null;G.x2Path=[];G.phase='move';G.turn=1-G.turn;refresh();if(G.turn===1)setTimeout(botTurn,650)}function endGame(pi){document.getElementById('winner').textContent=pi===0?'TU AS GAGNÉ !':'LE BOT GAGNE';document.getElementById('finalScore').textContent=`${me().score} - ${bot().score}`;document.getElementById('end').classList.remove('hidden')}
function clickNode(id){if(G.turn!==0||G.moving||!selectable(id))return;if(G.phase==='barrier'){me().barriers.push(id);me().barriersLeft--;endTurn();return}if(G.mode==='bam'){bot().barriers.splice(bot().barriers.indexOf(id),1);me().powers.bam=false;G.mode=null;animateMove(0,id,()=>afterMovement(0));return}if(G.mode==='tele'){me().powers.tele=false;G.mode=null;animateMove(0,id,()=>afterMovement(0));return}if(G.mode==='x2'){G.x2Path.push(id);if(G.x2Path.length===1){refresh();return}let [a,b]=G.x2Path;me().powers.x2=false;G.mode=null;G.x2Path=[];animateMove(0,a,()=>animateMove(0,b,()=>afterMovement(0)));return}animateMove(0,id,()=>afterMovement(0))}
function botTurn(){if(G.turn!==1)return;let path=shortest(bot().pos,bot().goal,1),dest=path&&path[1];if(dest){animateMove(1,dest,()=>afterMovement(1));return}if(bot().powers.tele){bot().powers.tele=false;animateMove(1,bot().goal,()=>afterMovement(1));return}endTurn()}function botBarrier(){let options=Object.keys(P).filter(id=>!occupied(id)&&barrierAt(id)<0),humanPath=shortest(me().pos,me().goal,0),choice=humanPath&&humanPath[1]&&options.includes(humanPath[1])?humanPath[1]:options[Math.floor(Math.random()*options.length)];if(choice){bot().barriers.push(choice);bot().barriersLeft--}endTurn()}
function hit(x,y){let best=null,d=Infinity;for(let c of clickable){let z=Math.hypot(x-c.x,y-c.y);if(z<c.r&&z<d){best=c;d=z}}if(best)clickNode(best.id)}const touches=new Map();let drag=null,pinch=null;view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,lt:performance.now(),moved:false};G.yawVelocity=0}else if(touches.size===2){let p=[...touches.values()];pinch={dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),start:G.targetCamDistance};if(drag)drag.moved=true}});view.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2&&pinch){let p=[...touches.values()],d=Math.max(20,Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y));G.targetCamDistance=Math.max(11,Math.min(28,pinch.start*(pinch.dist/d)));return}if(!drag||drag.id!==e.pointerId)return;let now=performance.now(),dx=e.clientX-drag.lx,dy=e.clientY-drag.ly,dt=Math.max(8,now-drag.lt);if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>7)drag.moved=true;if(drag.moved){G.targetYaw-=dx*.0062;G.yawVelocity=(-dx*.0062)/(dt/16.67);G.targetCamHeight=Math.max(4.5,Math.min(12.5,G.targetCamHeight+dy*.023))}drag.lx=e.clientX;drag.ly=e.clientY;drag.lt=now});function release(e){let was=drag&&drag.id===e.pointerId,moved=was&&drag.moved;touches.delete(e.pointerId);if(touches.size<2)pinch=null;if(was){if(!moved){let r=view.getBoundingClientRect();hit(e.clientX-r.left,e.clientY-r.top)}drag=null}}view.addEventListener('pointerup',release);view.addEventListener('pointercancel',release);
document.getElementById('x2').onclick=()=>{if(!me().powers.x2)return;G.mode=G.mode==='x2'?null:'x2';G.x2Path=[];refresh()};document.getElementById('bam').onclick=()=>{if(!me().powers.bam)return;G.mode=G.mode==='bam'?null:'bam';refresh()};document.getElementById('tele').onclick=()=>{if(!me().powers.tele)return;G.mode=G.mode==='tele'?null:'tele';refresh()};document.getElementById('pass').onclick=()=>{if(G.turn===0&&legal(0).length===0)endTurn()};document.getElementById('startBtn').onclick=startGame;
function update(dt){if(!drag&&Math.abs(G.yawVelocity)>.0001){G.targetYaw+=G.yawVelocity*(dt/16.67);G.yawVelocity*=Math.pow(.9,dt/16.67)}let d=G.targetYaw-G.yaw;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;G.yaw+=d*Math.min(1,dt*.018);G.camHeight+=(G.targetCamHeight-G.camHeight)*Math.min(1,dt*.012);G.camDistance+=(G.targetCamDistance-G.camDistance)*Math.min(1,dt*.014);if(G.moving){G.t+=dt/430;if(G.t>=1){G.t=1;let cb=G.moveDone;G.moveDone=null;cb&&cb()}}}let last=performance.now();function loop(now){let dt=Math.min(40,now-last);last=now;update(dt);drawSky();if(G.started){drawBoard();drawRadar()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
