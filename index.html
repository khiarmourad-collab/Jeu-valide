;margin:0}.card .fox{font-size:70px}.card button{width:100%;margin-top:16px;background:#f4ca63;color:#42210f;padding:14px}.hidden{display:none!important}#valid{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,#66f0c655,transparent 55%);font-size:44px;font-weight:1000;text-shadow:0 4px #4b2a15}#valid.show{display:flex}#valid span{font-size:92px;color:#78ffdb;margin-left:15px}@media(max-width:650px){#radarBox{width:145px;height:145px}#radarToggle{top:165px}#players{width:150px}#msg{top:190px;max-width:72%;text-align:center}#goal{width:115px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><canvas id="game"></canvas><div id="radarBox"><canvas id="radar"></canvas></div><button id="radarToggle">📡 MASQUER</button><div id="msg" class="panel">Préparation du désert…</div><div id="players" class="panel"></div><div id="goal" class="panel">🌴 TON OASIS<div id="gnum" class="num">?</div><div id="phase"></div></div><div id="powers"><button id="x2">🐾 SPRINT X2</button><button id="bam">💨 CREUSE !</button><button id="tele">🕳️ TERRIER</button><button id="pass">⏩ PASSER</button></div><div id="valid">JE VALIDE ! <span id="vnum"></span></div><div id="start"><div class="card panel"><h1>JEU VALIDE !</h1><div class="fox">🦊</div><p><b>SAHARA — vraie 3D</b><br>Explore le désert avec ton fennec et rejoins tes oasis secrètes.</p><button id="startBtn">ENTRER DANS LE DÉSERT</button></div></div><div id="end" class="hidden"><div class="card panel"><h1 id="winner"></h1><div class="fox">🦊🌴</div><p id="score"></p><button onclick="location.reload()">REJOUER</button></div></div><script type="module">import * as THREE from 'three';

for(let i=0;i<26;i++){let a=i*2.4,r=62+(i%5)*7,x=Math.sin(a)*r,z=Math.cos(a)*r,y=terrainY(x,z);let dune=new THREE.Mesh(new THREE.SphereGeometry(8+(i%4)*3,18,8),new THREE.MeshStandardMaterial({color:i%2?0xc9823e:0xe0a253,roughness:1}));dune.scale.set(2.5,.32,1.3);dune.position.set(x,y-1,z);dune.rotation.y=a*.37;dune.receiveShadow=true;scene.add(dune)}
function cylinderBetween(a,b,r,mat){let mid=a.clone().add(b).multiplyScalar(.5),len=a.distanceTo(b),m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,7),mat);m.position.copy(mid);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize());m.receiveShadow=true;return m}const pathMat=new THREE.MeshStandardMaterial({color:0x9f6033,roughness:1});E.forEach(([a,b])=>{let x=wp(a),y=wp(b);x.y+=.04;y.y+=.04;scene.add(cylinderBetween(x,y,.34,pathMat))});
const nodeMeshes=new Map();function labelTex(text){let cn=document.createElement('canvas');cn.width=256;cn.height=256;let x=cn.getContext('2d');x.clearRect(0,0,256,256);x.fillStyle='#fff8dc';x.font='bold 96px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(text,128,128);let t=new THREE.CanvasTexture(cn);t.colorSpace=THREE.SRGBColorSpace;return t}function palm(group,s=1){let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.11,.18,2.8,8),new THREE.MeshStandardMaterial({color:0x70401f}));trunk.position.y=1.4;trunk.rotation.z=-.08;trunk.castShadow=true;group.add(trunk);let green=new THREE.MeshStandardMaterial({color:0x28754a});for(let i=0;i<7;i++){let leaf=new THREE.Mesh(new THREE.CapsuleGeometry(.11,1.25,3,5),green);leaf.position.set(Math.cos(i*.9)*.6,2.95,Math.sin(i*.9)*.6);leaf.rotation.z=Math.PI/2;leaf.rotation.y=i*.9;leaf.castShadow=true;group.add(leaf)}}Object.keys(P).forEach(id=>{let g=new THREE.Group(),p=wp(id);g.position.copy(p);if(id.startsWith('V')){let rim=new THREE.Mesh(new THREE.TorusGeometry(1.25,.22,8,20),new THREE.MeshStandardMaterial({color:0x795039}));rim.rotation.x=Math.PI/2;g.add(rim);let hole=new THREE.Mesh(new THREE.CircleGeometry(.9,24),new THREE.MeshStandardMaterial({color:0x21130c}));hole.rotation.x=-Math.PI/2;hole.position.y=.02;g.add(hole)}else{let water=new THREE.Mesh(new THREE.CylinderGeometry(1.45,1.65,.16,28),new THREE.MeshPhysicalMaterial({color:0x43bca5,roughness:.22,metalness:.05}));water.position.y=.05;water.receiveShadow=true;g.add(water);let ring=new THREE.Mesh(new THREE.TorusGeometry(1.6,.25,8,28),new THREE.MeshStandardMaterial({color:0xe6c273}));ring.rotation.x=Math.PI/2;ring.position.y=.05;g.add(ring);palm(g,.9);let spr=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTex(id),transparent:true,depthTest:false}));spr.scale.set(1.7,1.7,1);spr.position.set(0,1.05,0);g.add(spr)}g.userData.id=id;scene.add(g);nodeMeshes.set(id,g)});
function makeFox(color){let g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color,roughness:.75}),cream=new THREE.MeshStandardMaterial({color:0xffe9bd});let body=new THREE.Mesh(new THREE.SphereGeometry(1,18,12),mat);body.scale.set(.85,.65,1.45);body.position.y=1;body.castShadow=true;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.68,18,12),mat);head.position.set(0,1.75,-.8);head.castShadow=true;g.add(head);for(let s of[-1,1]){let ear=new THREE.Mesh(new THREE.ConeGeometry(.34,1.35,4),mat);ear.position.set(s*.38,2.65,-.8);ear.rotation.z=s*.1;ear.castShadow=true;g.add(ear);let inner=new THREE.Mesh(new THREE.ConeGeometry(.19,.85,4),cream);inner.position.set(s*.38,2.65,-.94);inner.rotation.z=s*.1;g.add(inner)}let tail=new THREE.Mesh(new THREE.CapsuleGeometry(.28,1.7,6,10),mat);tail.position.set(.85,1,.65);tail.rotation.z=-1.0;tail.rotation.x=.4;tail.castShadow=true;g.add(tail);return g}const foxes=[makeFox(0xe9a73b),makeFox(0xd65a3e)];foxes.forEach(f=>scene.add(f));const dunes=[null,null];function rebuildDunes(){for(let i=0;i<2;i++){if(dunes[i])scene.remove(dunes[i]);dunes[i]=null;if(!G.p[i]?.b)continue;let p=wp(G.p[i].b),d=new THREE.Mesh(new THREE.SphereGeometry(1.8,18,10),new THREE.MeshStandardMaterial({color:i?0xb96735:0xd99743}));d.scale.set(1.8,.55,1);d.position.copy(p);d.position.y+=.35;d.castShadow=true;scene.add(d);dunes[i]=d}}

function startGame(){G.deck=sh([...Array(28)].map((_,i)=>i+1));G.p=[{pos:'S',s:0,g:null,b:null,pow:{x2:1,bam:1,tele:1},face:Math.PI},{pos:'N',s:0,g:null,b:null,pow:{x2:1,bam:1,tele:1},face:0}];G.p.forEach((p,i)=>p.g=goal(i));G.turn=Math.random()<.5?0:1;G.phase='move';G.on=true;placeFox(0);placeFox(1);start.classList.add('hidden');refresh();if(G.turn)setTimeout(botTurn,700)}
function canSelect(id){if(G.turn||G.moving)return false;if(G.phase==='barrier')return !occ(id)&&barr(id)<0&&id!==me().b;if(G.mode==='tele')return !occ(id,0)&&barr(id)<0;if(G.mode==='bam')return A[me().pos].includes(id)&&barr(id)===1&&bot().pos!==id;if(G.mode==='x2'){let f=G.xp.length?G.xp.at(-1):me().pos;return A[f].includes(id)&&!blocked(id,0)}return legal(0).includes(id)}
function move(i,id,cb){if(blocked(id,i))return;let p=G.p[i],a=wp(p.pos),b=wp(id),dx=P[id][0]-P[p.pos][0],dy=P[id][1]-P[p.pos][1];p.face=Math.atan2(dx,-dy);let f=foxes[i],t=0;G.moving=true;function step(){t=Math.min(1,t+.055);let e=t*t*(3-2*t);f.position.lerpVectors(a,b,e);f.position.y+=Math.sin(t*Math.PI)*1.2;f.rotation.y=p.face;if(t<1)requestAnimationFrame(step);else{p.pos=id;placeFox(i);G.moving=false;cb&&cb()}}step()}

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();canvas.addEventListener('pointerup',e=>{if(!G.on||G.moving)return;let r=canvas.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);let hits=ray.intersectObjects([...nodeMeshes.values()],true);if(!hits.length)return;let o=hits[0].object;while(o&&!o.userData.id)o=o.parent;if(o?.userData.id)choose(o.userData.id)});x2.onclick=()=>{G.mode=G.mode==='x2'?null:'x2';G.xp=[];refresh()};bam.onclick=()=>{G.mode=G.mode==='bam'?null:'bam';refresh()};tele.onclick=()=>{G.mode=G.mode==='tele'?null:'tele';refresh()};pass.onclick=()=>{if(!legal(0).length)endTurn()};radarToggle.onclick=()=>{G.radar=!G.radar;radarBox.classList.toggle('off',!G.radar);radarToggle.textContent=G.radar?'📡 MASQUER':'📡 AFFICHER'};startBtn.onclick=startGame;
const rc=radar.getContext('2d');function drawRadar(){if(!G.on||!G.radar)return;let w=radar.clientWidth,h=radar.clientHeight,d=Math.min(devicePixelRatio,2);if(radar.width!==w*d){radar.width=w*d;radar.height=h*d;rc.setTransform(d,0,0,d,0,0)}rc.clearRect(0,0,w,h);rc.fillStyle='#57351f';rc.fillRect(0,0,w,h);let s=Math.min(w,h)*.007,cx=w/2,cy=h/2;function rp(id){return{x:cx+(P[id][0]-50)*s,y:cy+(P[id][1]-50)*s}}rc.strokeStyle='#d6aa68';rc.lineWidth=1;E.forEach(([a,b])=>{let A=rp(a),B=rp(b);rc.beginPath();rc.moveTo(A.x,A.y);rc.lineTo(B.x,B.y);rc.stroke()});Object.keys(P).forEach(id=>{let p=rp(id);rc.fillStyle=id.startsWith('V')?'#24140c':'#69b99d';rc.beginPath();rc.arc(p.x,p.y,1.7,0,7);rc.fill()});let q=rp(me().g);rc.fillStyle='#6dffdc';rc.beginPath();rc.arc(q.x,q.y,5,0,7);rc.fill();G.p.forEach((p,i)=>{let q=rp(p.pos);rc.fillStyle=i?'#e75d43':'#f2c341';rc.beginPath();rc.arc(q.x,q.y,5,0,7);rc.fill()})}
