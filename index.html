function tex(t){let cn=document.createElement('canvas');cn.width=256;cn.height=256;let x=cn.getContext('2d');x.clearRect(0,0,256,256);x.fillStyle='#fff8dc';x.font='bold 96px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(t,128,128);let ct=new THREE.CanvasTexture(cn);ct.colorSpace=THREE.SRGBColorSpace;return ct}function palm(g){let tr=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,3,8),new THREE.MeshStandardMaterial({color:0x70401f}));tr.position.y=1.5;g.add(tr);let mat=new THREE.MeshStandardMaterial({color:0x28754a});for(let i=0;i<7;i++){let l=new THREE.Mesh(new THREE.BoxGeometry(1.5,.12,.24),mat);l.position.set(Math.cos(i*.9)*.65,3.05,Math.sin(i*.9)*.65);l.rotation.y=-i*.9;l.rotation.z=.12;g.add(l)}}const nodeMeshes=new Map();Object.keys(P).forEach(id=>{let g=new THREE.Group();g.position.copy(wp(id));if(id.startsWith('V')){let ring=new THREE.Mesh(new THREE.TorusGeometry(1.3,.22,8,24),new THREE.MeshStandardMaterial({color:0x795039}));ring.rotation.x=Math.PI/2;g.add(ring);let hole=new THREE.Mesh(new THREE.CircleGeometry(.95,24),new THREE.MeshStandardMaterial({color:0x21130c}));hole.rotation.x=-Math.PI/2;hole.position.y=.03;g.add(hole)}else{let water=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.7,.18,28),new THREE.MeshStandardMaterial({color:0x48b9a4}));water.position.y=.08;g.add(water);let ring=new THREE.Mesh(new THREE.TorusGeometry(1.7,.24,8,28),new THREE.MeshStandardMaterial({color:0xe6c273}));ring.rotation.x=Math.PI/2;ring.position.y=.08;g.add(ring);palm(g);let sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex(id),transparent:true,depthTest:false}));sp.position.set(0,1.1,0);sp.scale.set(1.8,1.8,1);g.add(sp)}scene.add(g);nodeMeshes.set(id,g)});
