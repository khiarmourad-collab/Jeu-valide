<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jeu Valide — Atelier des Rouages</title><style>*{box-sizing:border-box}body{margin:0;background:#111c2a;color:#f7e9c9;font-family:system-ui,-apple-system,sans-serif}header{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;background:#182538;border-bottom:1px solid #bb8951}h1{font-size:17px;margin:0}small{color:#b4c6d3}button{border:1px solid #e4b87a;background:#d9a965;color:#172333;border-radius:12px;padding:10px;font-weight:800;cursor:pointer;touch-action:manipulation}#view{position:relative;height:72dvh;min-height:410px;overflow:hidden;background:radial-gradient(ellipse at 55% 35%,#526f81 0%,#233e59 45%,#0d1b2d 100%)}#world{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}#radar{position:absolute;right:12px;top:12px;width:116px;height:116px;border-radius:14px;background:#101d30e8;border:1px solid #e3b26d;padding:6px;pointer-events:none}#info{position:absolute;left:12px;top:12px;max-width:calc(100% - 148px);background:#101d30e8;padding:11px;border-radius:12px;border:1px solid #b68b57;font-size:12px;line-height:1.6}#foot{padding:12px 15px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}#foot span{font-size:12px;color:#bac8d2}.node{cursor:pointer}.node.legal .rim{stroke:#72ffdf;stroke-width:5;filter:url(#halo)}.node:focus{outline:none}.node:focus .rim{stroke:#fff;stroke-width:5}#pawn{pointer-events:none;transition:transform .5s cubic-bezier(.2,.9,.2,1)}@media(min-width:800px){#view{height:75vh}} @media(prefers-reduced-motion:reduce){#pawn{transition:none}}#world{filter:drop-shadow(0 0 2px #071421)}#view:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#07132188 100%)}#info,#radar{z-index:2}</style></head><body><header><div><h1>⚙️ JEU VALIDE !</h1><small>Atelier des Rouages · Zone illustrée 02</small></div><button onclick="reset()">↺ Rejouer</button></header><div id="view"><svg id="world" viewBox="0 0 900 650" preserveAspectRatio="xMidYMid meet"><defs><radialGradient id="sky"><stop stop-color="#7198a7"/><stop offset="1" stop-color="#1c354d"/></radialGradient><linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0ba"/><stop offset=".25" stop-color="#dcac5c"/><stop offset=".62" stop-color="#9e5b2e"/><stop offset="1" stop-color="#f2cc7b"/></linearGradient><linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c58648"/><stop offset="1" stop-color="#593f38"/></linearGradient><radialGradient id="violet"><stop stop-color="#fff"/><stop offset=".18" stop-color="#eeb2ff"/><stop offset=".55" stop-color="#9d42e4"/><stop offset="1" stop-color="#40257f"/></radialGradient><filter id="halo"><feGaussianBlur stdDeviation="3"/></filter><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-opacity=".55"/></filter><pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 0L14 14M14 0L0 14" stroke="#643c23" opacity=".14"/></pattern></defs><rect width="900" height="650" fill="url(#sky)"/><g id="atmosphere"></g><g id="scenery"></g><g id="bridges"></g><g id="nodes"></g><g id="effects"></g><g id="pawn" transform="translate(450 545)"><ellipse cy="12" rx="22" ry="8" fill="#162535" opacity=".55"/><path d="M-15-5L-20-43L-4-28L0-38L10-27L24-44L18-4Z" fill="#46b7ed" stroke="#b7ecff" stroke-width="3"/><ellipse cy="-9" rx="20" ry="18" fill="#2591cb"/><path d="M-13-7Q0 5 13-7" fill="#f7e8d0"/><circle cx="-7" cy="-13" r="3" fill="#12243c"/><circle cx="8" cy="-13" r="3" fill="#12243c"/><circle cy="-6" r="3" fill="#172b39"/></g></svg><div id="info">Déplace le fennec bleu<br>sur une plateforme éclairée.<br><b id="status">Départ S</b></div><svg id="radar" viewBox="0 0 120 120"></svg></div><div id="foot"><button onclick="reset()">↺ Recommencer</button><span>Secteur mécanique enrichi · 7 plateformes · 6 connexions · Déplacements tactiles</span></div><script>
const P={S:[450,545],1:[330,430],16:[570,430],5:[230,300],12:[670,300],VSW:[325,160],VSE:[575,160]};
const E=[['S','1'],['S','16'],['1','5'],['16','12'],['5','VSW'],['12','VSE']];
const adj={};E.forEach(([a,b])=>{(adj[a]??=[]).push(b);(adj[b]??=[]).push(a)});
const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
function el(tag,attrs={},parent){const x=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,v));if(parent)parent.appendChild(x);return x}
const sc=$('scenery'),bridges=$('bridges'),nodes=$('nodes'),fx=$('effects'),atm=$('atmosphere');

/* Rich, independently rendered scenery: sky-islands, hanging chains, luminous energy and clockwork details. */
for(let i=0;i<32;i++){let x=(i*263+51)%900,y=(i*137+29)%650,r=1+(i%3);el('circle',{cx:x,cy:y,r,fill:i%3?'#ffe4ad':'#8deaff',opacity:.25+(i%5)*.11},atm)}
for(const [x,y,scale] of [[70,95,.8],[830,180,1.2],[85,585,.85],[785,565,1],[455,70,.65]]){
 const g=el('g',{transform:'translate('+x+' '+y+') scale('+scale+')',opacity:.78},atm);
 el('path',{d:'M-90 0Q-65-35-18-24Q20-51 59-19Q99-11 94 12Q42 38-20 31Q-80 36-90 0Z',fill:'#344f60',stroke:'#83a2a2','stroke-width':3},g);
 el('path',{d:'M-60 27L-19 110L26 40L54 25',fill:'#263644'},g);
 el('path',{d:'M-22-25L-12-85L5-91L18-25M-33-25H33',stroke:'#d3a464','stroke-width':7,fill:'none'},g);
 el('circle',{cy:-70,r:11,fill:'#ffe8a5',opacity:.9},g)
}
for(const [x,y,s] of [[115,330,.85],[795,260,1.1],[510,595,.9],[330,65,.65]]){
 const g=el('g',{transform:'translate('+x+' '+y+') scale('+s+')'},sc);
 el('path',{d:'M-22 0L-15-64L15-64L22 0Z',fill:'url(#side)',stroke:'#f6ce84','stroke-width':3},g);
 el('path',{d:'M-26-65L0-86L26-65Z',fill:'url(#brass)',stroke:'#fff0b8','stroke-width':3},g);
 el('circle',{cy:-46,r:10,fill:'url(#violet)',stroke:'#f4c8ff','stroke-width':3},g);
 el('path',{d:'M-18-3H18M-12-17H12',stroke:'#ffda8b','stroke-width':4},g)
}
for(const [x,y] of [[300,225],[615,240],[425,405],[715,490]]){
 const g=el('g',{},sc);el('path',{d:'M'+x+' '+y+'q-18 40-5 77t-9 67',stroke:'#2c2735','stroke-width':9,fill:'none'},g);
 for(let k=0;k<5;k++)el('ellipse',{cx:x-8+k%2*4,cy:y+12+k*22,rx:7,ry:11,fill:'none',stroke:'#b78852','stroke-width':3},g)
}

for(let i=0;i<17;i++){const x=35+(i*149)%840,y=60+(i*97)%500,r=16+(i*17)%45;el('circle',{cx:x,cy:y,r,fill:'none',stroke:'#9c774e','stroke-width':5,opacity:.2},sc);el('circle',{cx:x,cy:y,r:r*.65,fill:'none',stroke:'#e8bb76','stroke-width':2,opacity:.16},sc)}
for(let i=0;i<12;i++){const x=(i*237+67)%900,y=(i*113+80)%650;el('path',{d:'M'+x+' '+y+'l12 40 20 9 0 14',stroke:'#dfb36d','stroke-width':3,fill:'none',opacity:.27},sc)}
function gear(x,y,r,parent){let pts=[];for(let i=0;i<32;i++){const a=i*Math.PI/16,rad=i%4<2?r+8:r;pts.push((x+Math.cos(a)*rad).toFixed(1)+','+(y+Math.sin(a)*rad).toFixed(1))}el('polygon',{points:pts.join(' '),fill:'#86552f',stroke:'#e6b46b','stroke-width':2,opacity:.95},parent);el('circle',{cx:x,cy:y,r:r*.73,fill:'none',stroke:'#d8a45b','stroke-width':4},parent);el('circle',{cx:x,cy:y,r:8,fill:'#e9bf78'},parent)}
[[105,245,49],[792,425,70],[460,300,67],[730,105,40],[170,510,50]].forEach(([x,y,r])=>gear(x,y,r,sc));
E.forEach(([a,b])=>{const [x,y]=P[a],[u,v]=P[b],dx=u-x,dy=v-y,l=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;const g=el('g',{transform:'translate('+x+' '+y+') rotate('+ang+')',filter:'url(#shadow)'},bridges);el('rect',{x:0,y:-10,width:l,height:35,rx:4,fill:'#533c31'},g);el('rect',{x:0,y:-19,width:l,height:27,rx:3,fill:'url(#brass)',stroke:'#ffe4a0','stroke-width':2},g);el('rect',{x:0,y:-11,width:l,height:8,fill:'#73503d',opacity:.35},g);for(let k=10;k<l-8;k+=17)el('path',{d:'M'+k+' -19v27',stroke:'#6e482d','stroke-width':2,opacity:.65},g);el('path',{d:'M0-23H'+l+'M0 13H'+l,stroke:'#efcc86','stroke-width':3},g);for(let k=9;k<l-8;k+=28){el('circle',{cx:k,cy:-24,r:3,fill:'#fff0b2'},g);el('circle',{cx:k,cy:14,r:3,fill:'#ffe6a1'},g)}});
let current='S';
Object.entries(P).forEach(([id,[x,y]])=>{const g=el('g',{class:'node',transform:'translate('+x+' '+y+')',role:'button',tabindex:0,'aria-label':'Plateforme '+id},nodes);gear(0,12,39,g);el('ellipse',{cy:30,rx:51,ry:23,fill:'#1a2330',opacity:.3},g);el('ellipse',{cy:19,rx:47,ry:24,fill:'url(#side)',stroke:'#50382d','stroke-width':3},g);el('ellipse',{class:'rim',cy:0,rx:47,ry:24,fill:id.startsWith('V')?'url(#violet)':'url(#brass)',stroke:'#ffe3a0','stroke-width':3},g);el('ellipse',{cy:-2,rx:35,ry:16,fill:'none',stroke:id.startsWith('V')?'#ffdcff':'#8c5d3b','stroke-width':2},g);for(let k=0;k<12;k++){const a=k*Math.PI/6;el('circle',{cx:Math.cos(a)*40,cy:Math.sin(a)*19,r:2.5,fill:'#fff2bc'},g)}if(id.startsWith('V')){el('ellipse',{cy:-3,rx:30,ry:14,fill:'none',stroke:'#f4aaff','stroke-width':3,opacity:.85},g);el('path',{d:'M-12-6L0-28L12-6L0 9Z',fill:'#e6adff',opacity:.65},g)}el('text',{x:0,y:5,'text-anchor':'middle','font-size':18,'font-weight':900,fill:id.startsWith('V')?'#fff':'#51341f'},g).textContent=id.startsWith('V')?'✦':id;g.addEventListener('click',()=>move(id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();move(id)}})});
function render(){document.querySelectorAll('.node').forEach(g=>{const id=Object.keys(P).find(k=>'translate('+P[k][0]+' '+P[k][1]+')'===g.getAttribute('transform'));g.classList.toggle('legal',adj[current].includes(id))});const [x,y]=P[current];$('pawn').setAttribute('transform','translate('+x+' '+(y-21)+')');$('status').textContent='Position : '+current+' · chemins possibles : '+adj[current].join(', ');let s='';E.forEach(([a,b])=>{s+='<path d="M'+(P[a][0]/9)+' '+(P[a][1]/6.5)+'L'+(P[b][0]/9)+' '+(P[b][1]/6.5)+'" stroke="#b99b73" stroke-width="3"/>'});Object.entries(P).forEach(([id,[x,y]])=>{s+='<circle cx="'+(x/9)+'" cy="'+(y/6.5)+'" r="'+(id===current?6:3.5)+'" fill="'+(id===current?'#56d6ff':id.startsWith('V')?'#b468ff':'#eecb89')+'"/>'});$('radar').innerHTML='<text x="8" y="12" font-size="9" fill="#f3d4a1">RADAR</text><g transform="translate(8 12)">'+s+'</g>'}
function move(id){if(!adj[current].includes(id))return;current=id;render();const [x,y]=P[id];const ring=el("ellipse",{cx:x,cy:y,rx:8,ry:4,fill:"none",stroke:"#9bffeb","stroke-width":4,opacity:1},fx);ring.animate([{rx:8,ry:4,opacity:1},{rx:62,ry:30,opacity:0}],{duration:650,easing:"ease-out"}).onfinish=()=>ring.remove()}
function reset(){current='S';render()}
render();
</script></body></html>
