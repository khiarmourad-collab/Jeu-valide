rquoise · caméra automatique</div></div></div><p>Prototype 2,5D : vue rapprochée, caméra suiveuse et radar permanent. Décor non validé. Bleu = toi, rouge = bot.</p><script>
var edges="N-3 3-7 7-VNE VNE-11 11-15 15-E E-4 4-8 8-VSE VSE-12 12-16 16-S S-1 1-5 5-VSW VSW-9 9-13 13-W W-2 2-6 6-VNW VNW-10 10-14 14-N VNW-VT VT-VNE VNE-VR VR-VSE VSE-VB VB-VSW VSW-VL VL-VNW VT-23 23-VTL VTL-24 24-VL VT-18 18-VTR VTR-19 19-VR VR-20 20-VBR VBR-21 21-VB VB-17 17-VBL VBL-22 22-VL VTL-VIT VTL-VIL VTR-VIT VTR-VIR VBR-VIR VBR-VIB VBL-VIB VBL-VIL VIT-26 26-VIL VIT-27 27-VIR VIR-28 28-VIB VIB-25 25-VIL", adj={}, human='S',bot='N',turn=0,lock=false;
edges.split(' ').forEach(function(e){var p=e.split('-');(adj[p[0]]||(adj[p[0]]=[])).push(p[1]);(adj[p[1]]||(adj[p[1]]=[])).push(p[0]);});
function opts(a,b){return (adj[a]||[]).filter(function(x){return x!==b})}
function render(){document.querySelectorAll('.cell').forEach(function(b){var id=b.dataset.id;b.className='cell'+(id[0]==='V'?' portal':'');b.textContent=id[0]==='V'?'✦':id;if(id===human){b.className+=' human';b.textContent='🔵'}else if(id===bot){b.className+=' bot';b.textContent='🔴'}else if(!lock&&opts(human,bot).indexOf(id)>=0){b.className+=' allowed'}});document.getElementById('status').textContent='Tour '+turn+' · Bleu : '+human+' · Rouge : '+bot+(lock?' · Le bot joue…':' · À toi !');drawRadar();focusHuman()}
function move(id){if(lock||opts(human,bot).indexOf(id)<0)return;human=id;turn++;lock=true;render();setTimeout(function(){var a=opts(bot,human);if(a.length)bot=a[Math.floor(Math.random()*a.length)];lock=false;render()},350)}
function reset(){human='S';bot='N';turn=0;lock=false;overview=false;render()}
var overview=false;var vp=document.getElementById('viewport'),board=document.getElementById('board');function getPos(id){var b=document.querySelector('.cell[data-id="'+id+'"]');return b?{x:parseFloat(b.style.left)/100,y:parseFloat(b.style.top)/100}:{x:.5,y:.5}}function focusHuman(){overview=false;updateCamera()}function toggleOverview(){overview=!overview;updateCamera()}function updateCamera(){var w=vp.clientWidth,h=vp.clientHeight,bw=board.offsetWidth,p=getPos(human),scale=overview?Math.min(w/bw,h/bw):2.55;var tx=overview?(w-bw*scale)/2:w/2-p.x*bw*scale;var ty=overview?(h-bw*scale)/2:h/2-p.y*bw*scale;board.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';document.getElementById('viewbtn').textContent=overview?'🔍 Revenir au fennec':'🌍 Vue générale';drawRadar()}function drawRadar(){var r=document.getElementById('radar');var base=document.querySelector('#board>svg:not(.scenery)');r.innerHTML='<g stroke="#f8e4b7" stroke-width=".75" opacity=".85">'+base.innerHTML+'</g>';document.querySelectorAll('.cell').forEach(function(b){var p=getPos(b.dataset.id);r.innerHTML+='<circle cx="'+p.x*100+'" cy="'+p.y*100+'" r="1.5" fill="'+(b.dataset.id[0]==='V'?'#974be5':'#fff0c8')+'"/>'});var a=getPos(human),z=getPos(bot);r.innerHTML+='<circle cx="'+a.x*100+'" cy="'+a.y*100+'" r="3.2" fill="#168dff" stroke="white" stroke-width="1"/><circle cx="'+z.x*100+'" cy="'+z.y*100+'" r="3" fill="#ed4747" stroke="white" stroke-width="1"/>';if(!overview){r.innerHTML+='<rect x="'+Math.max(0,a.x*100-18)+'" y="'+Math.max(0,a.y*100-18)+'" width="36" height="36" fill="#fff8d91a" stroke="#fff" stroke-dasharray="3 2" stroke-width="1"/>'}}window.addEventListener('resize',updateCamera);reset();
</script></body></html>
